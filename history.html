<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>VorScore Tips — History</title>
<meta name="description" content="Track record and past football predictions from VorScore Tips.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body data-page="history">
<div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>
<div class="shell">

  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <svg class="logo-mark" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="9.5" stroke="#f0b43c" stroke-width="1.6"/>
        <path d="M12 6v6l4 2.2" stroke="#f0b43c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="logo-text">Vor<span>Score</span> Tips</span>
    </div>
    <nav class="menu">
      <a href="index.html" class="nav-item" data-page="tips">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><circle cx="12" cy="13.5" r="2.2"/></svg>
        Today's Tips
      </a>
      <a href="matches.html" class="nav-item" data-page="matches">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="12" r="2"/><path d="M6 8v8M8 6h4a2 2 0 0 1 2 2v0M8 18h4a2 2 0 0 0 2-2v0M14 12h2"/></svg>
        All Matches
      </a>
      <a href="history.html" class="nav-item" data-page="history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        Track Record
      </a>
      <a href="subscribe.html" class="nav-item" data-page="subscribe">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 21h8M12 17v4M6 4h12l-1 6a5 5 0 0 1-10 0L6 4Z"/></svg>
        Subscribe
      </a>
      <a href="history.html" class="nav-item" data-page="history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v6h6M12 7v5l3 2"/></svg>
        History
      </a>
      <div class="nav-divider"></div>
      <a href="blog.html" class="nav-item" data-page="blog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h10M7 16h6"/></svg>
        Blog
      </a>
    </nav>
    <div class="promo-card">
      <p class="promo-title">Unlock every locked tip</p>
      <p class="promo-sub">Subscribe for full access to bankers &amp; slips.</p>
      <a class="promo-btn" href="subscribe.html">Subscribe</a>
    </div>
  </aside>

  <main class="main">
    <header class="mobile-header">
      <button class="menu-toggle" id="menuToggle" type="button" aria-expanded="false" aria-controls="sidebar" aria-label="Open menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="mobile-brand">History</div>
    </header>

    <div class="topbar">
      <div>
        <p class="eyebrow">The record</p>
        <h1 id="historyTitle">History</h1>
      </div>
      <div class="avatar">↺</div>
    </div>

    <div class="date-tabs" id="historyDateTabs" aria-label="History dates"></div>
    <div class="history-nav" id="historyNav" hidden>
      <button type="button" class="history-nav-btn" id="historyPrev" aria-label="Older date">← Older</button>
      <span class="history-nav-label" id="historyNavLabel"></span>
      <button type="button" class="history-nav-btn" id="historyNext" aria-label="Newer date">Newer →</button>
    </div>
    <div id="historyArchive" class="history-archive"><div class="empty-row">Loading history…</div></div>
  </main>
</div>

<nav class="mobile-nav" aria-label="Main navigation">
  <a href="index.html" class="mobile-nav-btn" data-page="tips" aria-label="Today's Tips">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
    Tips
  </a>
  <a href="history.html" class="mobile-nav-btn" data-page="history" aria-label="History">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v6h6"/></svg>
    History
  </a>
  <a href="blog.html" class="mobile-nav-btn" data-page="blog" aria-label="Blog">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h10"/></svg>
    Blog
  </a>
</nav>

<script src="config.js"></script>
<script src="lib/resolve-result.js"></script>
<script src="js/match-data.js"></script>
<script src="js/shell.js"></script>
<script src="js/history.js"></script>
</body>
</html>
